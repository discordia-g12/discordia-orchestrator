# Actualizaciones de dependencias con un PR a develop, que pasa por el CI como cualquier cambio.
# Semanal, con las minor y patch de cada ecosistema juntas en un solo PR. Las major llegan de a una,
# porque pueden romper y hay que revisarlas.
version: 2
updates:
  # Las imágenes de deploy/docker-compose.yml se actualizan a mano: cambiar RabbitMQ o Kong de versión mayor requiere pasos previos
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
