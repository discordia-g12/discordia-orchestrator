services:
  # ==========================================
  # 0. API GATEWAY (Kong DB-less + Redis)
  # ==========================================
  gateway:
    build:
      context: ./Gateway
      dockerfile: Dockerfile
    container_name: discordia-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8001:8001"
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/usr/local/kong/declarative/kong.yml
      - KONG_ADMIN_LISTEN=0.0.0.0:8001
      - KONG_LUA_PACKAGE_PATH=/usr/local/share/lua/5.1/?.lua;;
      - KONG_NGINX_HTTP_INCLUDE=/etc/kong/shared-dicts.conf
      - KONG_NGINX_MAIN_INCLUDE=/etc/kong/main-env.conf
      - KONG_UNTRUSTED_LUA_SANDBOX_REQUIRES=gateway_health,auth0_validator,resty.openidc
      - KONG_LUA_SSL_TRUSTED_CERTIFICATE=/etc/ssl/certs/ca-certificates.crt
      - KONG_LUA_SSL_VERIFY_DEPTH=5
    env_file:
      - ./Gateway/.env
    volumes:
      - ./Gateway/kong.yml:/usr/local/kong/declarative/kong.yml:ro
      - ./Gateway/auth0_validator.lua:/usr/local/share/lua/5.1/auth0_validator.lua:ro
      - ./Gateway/gateway_health.lua:/usr/local/share/lua/5.1/gateway_health.lua:ro
      - ./Gateway/nginx/shared-dicts.conf:/etc/kong/shared-dicts.conf:ro
      - ./Gateway/nginx/main-env.conf:/etc/kong/main-env.conf:ro
    depends_on:
      gateway-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - discordia-net

  gateway-redis:
    image: redis:7-alpine
    container_name: discordia-gateway-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      discordia-net:
        aliases:
          - redis

  # ==========================================
  # 1. AUTH & USER SERVICE (Python / FastAPI)
  # ==========================================
  auth-service:
    build:
      context: ./Auth-User-Service
      dockerfile: Dockerfile
    container_name: discordia-auth-service
    restart: unless-stopped
    ports:
      - "8004:8000"
    environment:
      - DATABASE_HOST=auth-db
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=auth_db
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - discordia-net

  auth-db:
    image: postgres:15-alpine
    container_name: discordia-auth-db
    restart: unless-stopped
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - discordia-net

  # ==========================================
  # 2. SERVER & ROLES CORE SERVICE (Python)
  # ==========================================
  server-roles-service:
    build:
      context: ./Server-Roles-Core-Service
      dockerfile: Dockerfile
    container_name: discordia-server-roles-service
    restart: unless-stopped
    ports:
      - "8002:8080"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload"
    environment:
      - ENVIRONMENT=development
      - HOST=0.0.0.0
      - PORT=8080
      - PYTHONPATH=/app
      - DATABASE_HOST=server-roles-db
      - DATABASE_NAME=db
      - DATABASE_PORT=5432
      - DATABASE_USER=admin
      - DATABASE_PASSWORD=password
    volumes:
      - ./Server-Roles-Core-Service:/app
    depends_on:
      server-roles-db:
        condition: service_healthy
    networks:
      - discordia-net

  server-roles-db:
    image: postgres:16-alpine
    container_name: discordia-server-roles-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    volumes:
      - server-roles-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - discordia-net

  # ==========================================
  # 3. PAYMENTS & MONETIZATION SERVICE (Python)
  # ==========================================
  payments-service:
    build:
      context: ./Payments-Monetization-Service
      dockerfile: Dockerfile
    container_name: discordia-payments-service
    restart: unless-stopped
    ports:
      - "8003:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@payments-db:5432/payments_db
    depends_on:
      payments-db:
        condition: service_healthy
    networks:
      - discordia-net

  payments-db:
    image: postgres:15-alpine
    container_name: discordia-payments-db
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payments_db
    volumes:
      - payments-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payments_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - discordia-net

  # ==========================================
  # 4. CHAT ENGINE SERVICE (Node.js / Fastify)
  # ==========================================
  chat-engine-service:
    build:
      context: ./Chat-Engine-Service
      dockerfile: Dockerfile
    container_name: discordia-chat-engine-service
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://chat-mongo:27017/chat_db
      - CORE_SERVICE_URL=http://server-roles-service:8080
      - REDIS_URL=redis://chat-redis:6379
    depends_on:
      chat-mongo:
        condition: service_healthy
      chat-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/livez > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      discordia-net:
        aliases:
          - chat-service

  chat-mongo:
    image: mongo:7.0
    container_name: discordia-chat-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - chat-mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - discordia-net

  chat-redis:
    image: redis:7-alpine
    container_name: discordia-chat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - chat-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - discordia-net

  # ==========================================
  # 5. VOICE SIGNALING SESSION SERVICE (Node.js)
  # ==========================================
  voice-signaling-service:
    build:
      context: ./Voice-Signaling-Session-Service
      dockerfile: Dockerfile
    container_name: discordia-voice-signaling-service
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      - NODE_ENV=development
      - PORT=8080
      - REDIS_HOST=voice-redis
      - REDIS_PORT=6379
      - LIVEKIT_API_KEY=tu_api_key
      - LIVEKIT_API_SECRET=tu_api_secret
      - LIVEKIT_URL=ws://ruta_a_livekit
    depends_on:
      voice-redis:
        condition: service_healthy
    networks:
      - discordia-net

  voice-redis:
    image: redis:7-alpine
    container_name: discordia-voice-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - discordia-net

  # ==========================================
  # 6. NOTIFICATION & AUDIT SERVICE (Node.js)
  # ==========================================
  notification-service:
    build:
      context: ./Notification-Audit-Metrics-Service
      dockerfile: Dockerfile
    container_name: discordia-notification-service
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:password@notification-db:5432/notification_db
    depends_on:
      notification-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/livez > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - discordia-net

  notification-db:
    image: postgres:16-alpine
    container_name: discordia-notification-db
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - discordia-net

  # ==========================================
  # 7. WEB CLIENT APPLICATION (React / Vite)
  # ==========================================
  webapp:
    build:
      context: ./Discordia-WebApp
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
        - VITE_WS_URL=${VITE_WS_URL:-http://localhost:8000}
        - VITE_AUTH0_DOMAIN=${VITE_AUTH0_DOMAIN:-dev-dppme5iaqg60gkmo.us.auth0.com}
        - VITE_AUTH0_CLIENT_ID=${VITE_AUTH0_CLIENT_ID:-f2H8PhlKDl3KSIm64G5mHAeQih7iFyIP}
        - VITE_AUTH0_AUDIENCE=${VITE_AUTH0_AUDIENCE:-https://api.discordia.com}
        - VITE_USE_MOCK=${VITE_USE_MOCK:-false}
    container_name: discordia-webapp
    restart: unless-stopped
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/livez > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - discordia-net


# ==========================================
# SHARED NETWORKS & VOLUMES
# ==========================================
networks:
  discordia-net:
    name: discordia-net
    driver: bridge

volumes:
  auth-db-data:
  server-roles-db-data:
  payments-db-data:
  chat-mongo-data:
  chat-redis-data:
  notification-db-data: