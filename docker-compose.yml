services:
  # ==========================================
  # 0. API GATEWAY (Kong DB-less + Redis)
  # ==========================================
  gateway:
    build:
      context: ./Gateway
      dockerfile: Dockerfile
    container_name: discordia-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8001:8001"
    environment:
      # El resto de la configuración de Kong viene en la imagen (Gateway/Dockerfile).
      # Los destinos de los servicios usan los defaults de Gateway/render-config.sh (nombres de este compose).
      - KONG_ADMIN_LISTEN=0.0.0.0:8001
      - KONG_NGINX_WORKER_PROCESSES=1
      - KONG_UNTRUSTED_LUA_SANDBOX_REQUIRES=gateway_health,auth0_validator,resty.openidc,resty.http,cjson.safe
    env_file:
      - ./Gateway/.env
    volumes:
      # Montados encima de los de la imagen para editar sin reconstruir (reiniciar el contenedor)
      - ./Gateway/kong.yml:/etc/kong/kong.yml.tmpl:ro
      - ./Gateway/auth0_validator.lua:/usr/local/share/lua/5.1/auth0_validator.lua:ro
      - ./Gateway/gateway_health.lua:/usr/local/share/lua/5.1/gateway_health.lua:ro
      - ./Gateway/nginx/shared-dicts.conf:/etc/kong/shared-dicts.conf:ro
      - ./Gateway/nginx/main-env.conf:/etc/kong/main-env.conf:ro
    depends_on:
      gateway-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    networks:
      - discordia-net

  gateway-redis:
    image: redis:7-alpine
    container_name: discordia-gateway-redis
    restart: unless-stopped
    # Contadores de rate limit y cuentas suspendidas (las escribe auth-service, las lee Kong). volatile-lru: si
    # se llena descarta solo claves con TTL (contadores); la de cada email suspendido no tiene TTL y nunca se
    # pierde (ADR-002 de Auth-User-Service).
    command: ["redis-server", "--maxmemory", "40mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
    networks:
      discordia-net:
        aliases:
          - redis

  postgres:
    image: postgres:16-alpine
    container_name: discordia-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${RDS_USER:-postgres}
      POSTGRES_PASSWORD: ${RDS_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RDS_USER:-postgres} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    networks:
      - discordia-net

  # ==========================================
  # 1. AUTH & USER SERVICE (Python / FastAPI)
  # ==========================================
  auth-service:
    build:
      context: ./Auth-User-Service
      dockerfile: Dockerfile
    container_name: discordia-auth-service
    restart: unless-stopped
    ports:
      # Solo desarrollo: este puerto saltea Kong (se puede mandar X-User-Id a mano).
      - "8004:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_HOST=${RDS_HOST}
      - DATABASE_PORT=${RDS_PORT:-5432}
      - DATABASE_USER=${RDS_USER}
      - DATABASE_PASSWORD=${RDS_PASSWORD}
      - DATABASE_NAME=auth_db

      - AUTH0_DOMAIN=${AUTH0_DOMAIN:-dev-dppme5iaqg60gkmo.us.auth0.com}
      - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID:-f2H8PhlKDl3KSIm64G5mHAeQih7iFyIP}
      - AUTH0_DB_CONNECTION=Username-Password-Authentication

      # Suspensión de usuarios (backoffice). Aplicación Machine to Machine de Auth0 (read:users, update:users):
      # sin ella, suspender responde 503. La lista de suspendidos va al Redis del Gateway
      - AUTH0_MGMT_CLIENT_ID=${AUTH0_MGMT_CLIENT_ID:-}
      - AUTH0_MGMT_CLIENT_SECRET=${AUTH0_MGMT_CLIENT_SECRET:-}
      - GATEWAY_REDIS_HOST=gateway-redis
      - GATEWAY_REDIS_PORT=6379
      # Vida del access token en la API de Auth0 (86400 s por defecto)
      - SUSPENSION_DENYLIST_TTL_SECONDS=${SUSPENSION_DENYLIST_TTL_SECONDS:-86400}

      # Imágenes en S3. Sin S3_BUCKET la subida responde 503 (el resto anda igual).
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_PUBLIC_BASE_URL=${S3_PUBLIC_BASE_URL:-}
      - AWS_ACCESS_KEY_ID=${AUTH_AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AUTH_AWS_SECRET_ACCESS_KEY:-}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    networks:
      - discordia-net

  auth-outbox-worker:
    build:
      context: ./Auth-User-Service
      dockerfile: Dockerfile
    container_name: discordia-auth-outbox-worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.outbox_publisher"]
    environment:
      - ENVIRONMENT=development
      - DATABASE_HOST=${RDS_HOST}
      - DATABASE_PORT=${RDS_PORT:-5432}
      - DATABASE_USER=${RDS_USER}
      - DATABASE_PASSWORD=${RDS_PASSWORD}
      - DATABASE_NAME=auth_db
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-admin}
    depends_on:
      auth-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # Sin HTTP: el worker toca /tmp/outbox-heartbeat al terminar cada ciclo de poll
    # exitoso. Si el archivo tiene más de 30 s, el worker está trabado o sin base.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(0 if time.time() - os.stat('/tmp/outbox-heartbeat').st_mtime < 30 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 128M
    networks:
      - discordia-net

  # ==========================================
  # MESSAGE BROKER (compartido por la plataforma)
  # ==========================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: discordia-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI (solo desarrollo)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 320M
    networks:
      - discordia-net

  # ==========================================
  # 2. SERVER & ROLES CORE SERVICE (Python)
  # ==========================================
  server-roles-service:
    build:
      context: ./Server-Roles-Core-Service
      dockerfile: Dockerfile
    container_name: discordia-server-roles-service
    restart: unless-stopped
    ports:
      - "8002:8080"
    # --reload levanta un proceso vigilante además del servidor: solo para desarrollo.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload"
    environment:
      - ENVIRONMENT=development
      - HOST=0.0.0.0
      - PORT=8080
      - PYTHONPATH=/app
      - DATABASE_HOST=${RDS_HOST}
      - DATABASE_NAME=server_roles_db
      - DATABASE_PORT=${RDS_PORT:-5432}
      - DATABASE_USER=${RDS_USER}
      - DATABASE_PASSWORD=${RDS_PASSWORD}
      # Imágenes en S3. Sin S3_BUCKET la subida responde 503 (el resto anda igual).
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_PUBLIC_BASE_URL=${S3_PUBLIC_BASE_URL:-}
      - AWS_ACCESS_KEY_ID=${SERVER_ROLES_AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${SERVER_ROLES_AWS_SECRET_ACCESS_KEY:-}
    volumes:
    - ./Server-Roles-Core-Service:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Margen para que corra "alembic upgrade head" antes de levantar uvicorn.
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    networks:
      - discordia-net

  server-roles-outbox-worker:
    build:
      context: ./Server-Roles-Core-Service
      dockerfile: Dockerfile
    container_name: discordia-server-roles-outbox-worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.outbox_publisher"]
    environment:
      - ENVIRONMENT=development
      - DATABASE_HOST=${RDS_HOST}
      - DATABASE_PORT=${RDS_PORT:-5432}
      - DATABASE_USER=${RDS_USER}
      - DATABASE_PASSWORD=${RDS_PASSWORD}
      - DATABASE_NAME=server_roles_db
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-admin}
      - RABBITMQ_EXCHANGE=server.events
    volumes:
      - ./Server-Roles-Core-Service:/app
    depends_on:
      server-roles-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(0 if time.time() - os.stat('/tmp/outbox-heartbeat').st_mtime < 30 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 128M
    networks:
      - discordia-net

  # ==========================================
  # 3. PAYMENTS & MONETIZATION SERVICE (Python)
  # ==========================================
  payments-service:
    build:
      context: ./Payments-Monetization-Service
      dockerfile: Dockerfile
    container_name: discordia-payments-service
    restart: unless-stopped
    ports:
      - "8003:8000"
    environment:
    # Driver explícito: SQLAlchemy 2.1 cambió el default de postgresql:// a psycopg 3 (la imagen trae psycopg2)
    - DATABASE_URL=postgresql+psycopg2://${RDS_USER}:${RDS_PASSWORD}@${RDS_HOST}:${RDS_PORT:-5432}/payments_db
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 192M
    networks:
      - discordia-net

  # ==========================================
  # 4. CHAT ENGINE SERVICE (Node.js / Fastify)
  # ==========================================
  chat-engine-service:
    build:
      context: ./Chat-Engine-Service
      dockerfile: Dockerfile
    container_name: discordia-chat-engine-service
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://chat-mongo:27017/chat_db
      - CORE_SERVICE_URL=http://server-roles-service:8080
      - AUTH_SERVICE_URL=http://auth-service:8000
      - REDIS_URL=redis://chat-redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin}@rabbitmq:5672/
      - NODE_OPTIONS=--max-old-space-size=192
    volumes:
      - chat-uploads-data:/usr/src/app/uploads
    depends_on:
      chat-mongo:
        condition: service_healthy
      chat-redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/readyz > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 256M
    networks:
      discordia-net:
        aliases:
          - chat-service

  chat-mongo:
    image: mongo:7.0
    container_name: discordia-chat-mongo
    restart: unless-stopped
    # 0.25 es el mínimo que acepta mongod para la caché de WiredTiger.
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "27017:27017"
    volumes:
      - chat-mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    networks:
      - discordia-net

  chat-redis:
    image: redis:7-alpine
    container_name: discordia-chat-redis
    restart: unless-stopped
    # noeviction: si se llena, Redis rechaza escrituras en vez de borrar datos de chat en silencio.
    command: ["redis-server", "--maxmemory", "100mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - chat-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.20"
          # Margen sobre maxmemory para buffers de pub/sub y el fork de los snapshots.
          memory: 160M
    networks:
      - discordia-net

  # ==========================================
  # 5. VOICE SIGNALING SESSION SERVICE (Node.js)
  # ==========================================
  voice-signaling-service:
    build:
      context: ./Voice-Signaling-Session-Service
      dockerfile: Dockerfile
    container_name: discordia-voice-signaling-service
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      - NODE_ENV=development
      - PORT=8080
      - REDIS_HOST=voice-redis
      - REDIS_PORT=6379
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-devsecret_change_me_min_32_chars_long}
      # URL interna (red de Docker) para el SDK server: RoomService, webhooks, etc.
      - LIVEKIT_URL=http://livekit:7880
      # URL que se le devuelve al cliente junto con el token: el browser se conecta directo a LiveKit
      - LIVEKIT_PUBLIC_URL=${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      # Eventos member.banned / kicked / left: saca al usuario de la llamada
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin}@rabbitmq:5672/
      - RABBITMQ_EXCHANGE=server.events
      - NODE_OPTIONS=--max-old-space-size=192
    depends_on:
      voice-redis:
        condition: service_healthy
      livekit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    networks:
      - discordia-net

  livekit:
    image: livekit/livekit-server:v1.13.7
    container_name: discordia-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"       # API + señalización WebSocket
      - "7881:7881"       # Media WebRTC por TCP (fallback)
      - "7882:7882/udp"   # Media WebRTC por UDP
    environment:
      - "LIVEKIT_KEYS=${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret_change_me_min_32_chars_long}"
      # IP que LiveKit anuncia a los clientes para la media. En local, 127.0.0.1;
      # en un deploy, la IP pública del host.
      - NODE_IP=${LIVEKIT_NODE_IP:-127.0.0.1}
      # Key con la que LiveKit firma los webhooks hacia voice-signaling-service (ver livekit.yaml)
      - LIVEKIT_WEBHOOK_API_KEY=${LIVEKIT_API_KEY:-devkey}
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7880 > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 384M
    networks:
      - discordia-net

  voice-redis:
    image: redis:7-alpine
    container_name: discordia-voice-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "40mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
    networks:
      - discordia-net

  # ==========================================
  # 6. NOTIFICATION & AUDIT SERVICE (Node.js)
  # ==========================================
  notification-service:
    build:
      context: ./Notification-Audit-Metrics-Service
      dockerfile: Dockerfile
    container_name: discordia-notification-service
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://${RDS_USER}:${RDS_PASSWORD}@${RDS_HOST}:${RDS_PORT:-5432}/notification_db
      - NODE_OPTIONS=--max-old-space-size=96
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/readyz > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    networks:
      - discordia-net

  # ==========================================
  # 7. WEB CLIENT APPLICATION (React / Vite)
  # ==========================================
  webapp:
    build:
      context: ./Discordia-WebApp
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
        - VITE_AUTH0_DOMAIN=${VITE_AUTH0_DOMAIN:-dev-dppme5iaqg60gkmo.us.auth0.com}
        - VITE_AUTH0_CLIENT_ID=${VITE_AUTH0_CLIENT_ID:-f2H8PhlKDl3KSIm64G5mHAeQih7iFyIP}
        - VITE_AUTH0_AUDIENCE=${VITE_AUTH0_AUDIENCE:-https://api.discordia.com}
        - VITE_USE_MOCK=${VITE_USE_MOCK:-false}
    container_name: discordia-webapp
    restart: unless-stopped
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/livez > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - discordia-net


# ==========================================
# SHARED NETWORKS & VOLUMES
# ==========================================
networks:
  discordia-net:
    name: discordia-net
    driver: bridge

volumes:
  postgres-data: null
  chat-mongo-data: null
  chat-redis-data: null
  rabbitmq-data: null
  chat-uploads-data: null