# Configuración del servidor LiveKit (SFU de voz) para desarrollo local.
# Las API keys NO van acá: se pasan por la variable LIVEKIT_KEYS desde docker-compose.yml,
# para que siempre coincidan con las que usa voice-signaling-service.

port: 7880              # API HTTP + señalización WebSocket (clientes y SDK server)
bind_addresses:
  - 0.0.0.0

rtc:
  tcp_port: 7881        # Fallback de media por TCP
  udp_port: 7882        # Media WebRTC por UDP (un único puerto multiplexado)
  # En local no queremos que descubra la IP pública vía STUN; la IP anunciada
  # a los clientes se fija con NODE_IP en docker-compose.yml.
  use_external_ip: false

logging:
  level: info

# Cuando voice-signaling-service exponga el endpoint de webhooks, habilitar:
# webhook:
#   api_key: devkey
#   urls:
#     - http://voice-signaling-service:8080/api/v1/voice/webhooks/livekit
